name: cachix

# Builds mux as a Nix derivation and publishes it to the `mux` Cachix cache,
# so a NixOS machine installs it without compiling Skia, FFmpeg or a
# C++26-modules toolchain.
#
# Consumers add the cache with:
#     cachix use mux
# which writes `extra-substituters = https://mux.cachix.org` plus the
# trusted public key. The cache is public and uses managed signing, so no
# signing key is needed anywhere.
on:
  # No `paths:` filter here on purpose. An earlier version listed only the
  # flake and this workflow, which meant a commit fixing src/ -- which is
  # where every failure so far has been -- triggered no build at all and
  # the fix looked untested. A source change must run the build.
  push:
    branches: [main, 'integrate/**', 'fixes/**']
  pull_request:
  workflow_dispatch:
  schedule:
    # 04:17 UTC daily, off the hour so it does not pile onto everyone
    # else's cron. Upstream mux moves fast; a stale pin should not quietly
    # keep serving an old build.
    - cron: "17 4 * * *"

# One build per branch at a time, and a push to one branch never cancels
# another's: github.ref is in the group, so main, integrate/cleanup and
# fixes/next are three independent groups.
#
# cancel-in-progress is FALSE on purpose. A build takes about twenty
# minutes and almost all of it is Skia and FFmpeg, which do not depend on
# mux's own sources at all -- only the last ~30 steps do. Cancelling
# because a one-line fix landed throws away that entire shared prefix to
# redo it on a fresh runner. Queueing wastes only the superseded run's
# own tail.
concurrency:
  group: cachix-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Cheap gate: proves the whole dependency graph still resolves (Skia,
  # FFmpeg's eight codecs, SDL3) without spending an hour compiling. Runs
  # on every PR, so a dependency break surfaces in minutes.
  configure-check:
    name: configure only
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            # The build needs network at CONFIGURE time, not because the
            # result is unpinned but because cmake-everywhere fetches a few
            # things itself: boostorg/pfr goes through CPM/FetchContent
            # rather than through cme's -D<PORT>_SOURCE_DIR, so it still
            # git-clones, and Skia is fetched as a pinned archive by gn.
            # Both are pinned by commit/digest, so the resulting store path
            # is the same one a fully hermetic build would produce --
            # which is what makes it safe to cache. TODO: vendor the last
            # few fetches and turn this back off.
            sandbox = false
      - name: Configure
        run: nix build .#mux-configure --print-build-logs --no-link

  build:
    name: build and push
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            # The build needs network at CONFIGURE time, not because the
            # result is unpinned but because cmake-everywhere fetches a few
            # things itself: boostorg/pfr goes through CPM/FetchContent
            # rather than through cme's -D<PORT>_SOURCE_DIR, so it still
            # git-clones, and Skia is fetched as a pinned archive by gn.
            # Both are pinned by commit/digest, so the resulting store path
            # is the same one a fully hermetic build would produce --
            # which is what makes it safe to cache. TODO: vendor the last
            # few fetches and turn this back off.
            sandbox = false

      # Skia + FFmpeg + an `import std` toolchain can outgrow the runner's
      # ~14 GB of disk part-way through, and the failure then looks like an
      # unrelated compiler error. Watch it, and free anything substitutable.
      - name: Free substitutable paths first
        run: |
          nix store gc --no-delete 2>/dev/null || true
          df -h /nix | tail -1

      - name: Build
        id: build
        run: |
          set -euo pipefail
          nix build .#mux --print-build-logs --out-link ./result
          # Every path in the closure, so the cache can serve the binary and
          # everything it needs to run.
          #
          # SPACE separated, not newline: the action splits pathsToPush with
          # args.split(" "), so newlines would arrive as one malformed path
          # and the push would silently do nothing again. printf '%s ' into
          # a single-line output, then trim.
          {
            echo 'paths<<OUT_EOF'
            nix path-info --recursive ./result | tr '\n' ' '
            echo ''
            echo 'OUT_EOF'
          } >> "$GITHUB_OUTPUT"
          echo "store path: $(nix path-info ./result)"
          echo "closure: $(nix path-info --recursive ./result | wc -l) paths"
          ls -la ./result/bin/
          df -h /nix | tail -1

      # Push the build's whole closure, explicitly.
      #
      # useDaemon was left at its default, which registers a post-build hook
      # and pushes paths as they are *built*. But the build here is a
      # separate step that had already finished by the time the daemon
      # started, so there was nothing left for it to observe: it started,
      # found no new paths, and exited reporting success while the cache
      # stayed empty. Naming the paths instead makes the push depend on
      # this run's output rather than on having observed the build.
      #
      # fixes/next builds to prove a change compiles and must not publish:
      # only the branches meant to be consumed push to the cache.
      - name: Push to Cachix
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/integrate/')
        uses: cachix/cachix-action@v17
        with:
          name: mux
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          useDaemon: false
          pathsToPush: ${{ steps.build.outputs.paths }}

      - name: Summary
        run: |
          path="$(nix path-info ./result)"
          {
            echo "### mux built and pushed"
            echo
            echo "Store path: \`$path\`"
            echo
            echo "To use it from NixOS:"
            echo '```console'
            echo '$ cachix use mux'
            echo '$ nix run nixpkgs#mux   # or whatever exposes it'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"